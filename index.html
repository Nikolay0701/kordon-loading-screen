<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anomaly Zone - Кордон</title>
  <style>
    @font-face {
      font-family: 'StalkerAlt';
      src: url('https://fonts.cdnfonts.com/s/102047/Road_Rage.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    /* Фоны */
    #bg { position: fixed; inset: 0; z-index: 0; }
    #bg div {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 2s ease-in-out;
    }
    #bg div.active { opacity: 1; }

    .metal-frame {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      box-shadow: inset 0 0 8vh rgba(0,0,0,0.4);
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      mix-blend-mode: overlay;
    }

    .hud-scan {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background-image: linear-gradient(transparent 30%, rgba(0,0,0,0.02) 31%);
      background-size: 100% 6px;
      opacity: 0.25;
    }

    .tips {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 4vh;
      z-index: 6;
      width: 90vw;
      color: #ffdb99;
      font-family: Inter, monospace, sans-serif;
      font-size: clamp(12px, 1.1vw, 22px);
      text-align: center;
    }

    .tips h3 {
      margin: 0 0 0.5vh 0;
      color: #ffb84d;
      font-family: monospace, sans-serif;
      font-size: clamp(12px, 1.1vw, 22px);
    }

    .tips #tipText {
      margin-top: 0.5vh;
      font-size: clamp(12px, 1.1vw, 22px);
    }
  </style>
</head>
<body>

  <div id="bg">
    <div class="active" style="background-image:url('img/1.png')"></div>
    <div style="background-image:url('img/2.png')"></div>
    <div style="background-image:url('img/3.png')"></div>
  </div>

  <div class="metal-frame"></div>
  <div class="grain"></div>
  <div class="hud-scan"></div>

  <div class="tips">
    <h3>Совет:</h3>
    <div id="tipText"></div>
  </div>

  <script>
    // Смена фонов
    const slides = document.querySelectorAll('#bg div');
    let cur = 0;
    setInterval(() => {
      slides[cur].classList.remove('active');
      cur = (cur + 1) % slides.length;
      slides[cur].classList.add('active');
    }, 8000); // 8 секунд

    // Советы
    const tips = [
      'В Зоне нет случайностей — если нашёл артефакт слишком легко, значит, рядом что-то тебя уже ждёт.',
      'Патроны — это валюта. Береги их, торгуй ими, но никогда не оставайся без пары магазинов в запасе.',
      'Аномалия «Воронка» тянет вниз быстрее, чем успеешь выругаться. Болт в помощь — кидай, пока жив.',
      'Не верь улыбкам наёмников. Их контракт всегда дороже твоей жизни.',
      'Артефакт «Каменный цветок» красив, но радиоактивен — таскай с контейнером или умрёшь медленно.',
      'Хабар в схронах редко лежит бесхозно — кто-то его туда положил и может вернуться.',
      'Ночью в Зоне тишина громче выстрелов — прислушивайся, она подскажет, кто рядом.',
      'Пси-излучение ломает не кости, а голову. Не недооценивай его.',
      'Если услышал треск детектора — не суетись, а думай: артефакт рядом или ловушка?',
      'Зона не любит глупых — будь хитрым, будь живым.'
    ];

    let tipIndex = 0;
    const tipText = document.getElementById('tipText');

    function showTip() {
      tipText.textContent = tips[tipIndex];
      tipIndex = (tipIndex + 1) % tips.length;
    }

    showTip();
    setInterval(showTip, 30000);
  </script>

</body>
</html>
